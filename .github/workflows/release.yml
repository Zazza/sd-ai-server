name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
          VERSION: ${{ github.ref_name }}
        run: |
          output=sd-studio-server
          [ "$GOOS" = "windows" ] && output="${output}.exe"
          go build -ldflags "-s -w -X main.version=${VERSION#v}" -o "$output" .
      - name: Package
        env:
          GOOS: ${{ matrix.goos }}
        run: |
          name=sd-studio-server-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}
          mkdir "$name"
          if [ "$GOOS" = "windows" ]; then
            mv sd-studio-server.exe "$name/sd-studio-server.exe"
          else
            mv sd-studio-server "$name/sd-studio-server"
          fi
          cp server-config.yaml README.md "$name/"
          tar czf "${name}.tar.gz" "$name"
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.tar.gz"
